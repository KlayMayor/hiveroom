<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini 이미지 생성 테스트</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --honey: #F2B830;
    --hdk: #A87800;
    --bg: #FDFAF4;
    --card: #fff;
    --border: #EDE8DC;
    --text: #2A2015;
    --muted: #8A7A60;
    --hlt: #FFF8E8;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 16px;
  }
  .container {
    max-width: 640px;
    margin: 0 auto;
  }
  .header {
    text-align: center;
    margin-bottom: 32px;
  }
  .header h1 {
    font-family: 'Jua', sans-serif;
    font-size: 26px;
    color: var(--hdk);
    margin-bottom: 6px;
  }
  .header p {
    font-size: 12px;
    color: var(--muted);
  }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1.5px solid var(--border);
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,.04);
  }
  .card-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type=text], input[type=password], textarea, select {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    outline: none;
    background: var(--bg);
    transition: border-color .15s;
    color: var(--text);
  }
  input:focus, textarea:focus, select:focus { border-color: var(--honey); }
  textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row > * { flex: 1; }
  .btn {
    display: block;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    font-family: 'Jua', sans-serif;
    font-size: 15px;
    cursor: pointer;
    transition: all .15s;
    margin-top: 4px;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--honey), #E8A020);
    color: #fff;
    box-shadow: 0 4px 14px rgba(242,184,48,.4);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(242,184,48,.5); }
  .btn-primary:disabled { background: #DDD; color: #AAA; box-shadow: none; transform: none; cursor: not-allowed; }
  .btn-secondary {
    background: var(--hlt);
    color: var(--hdk);
    border: 1.5px solid var(--border);
    font-size: 13px;
    margin-top: 8px;
  }
  .btn-secondary:hover { background: #FFF0C0; }

  /* 결과 영역 */
  .result-area {
    display: none;
    text-align: center;
  }
  .result-area.show { display: block; }
  .result-img-wrap {
    position: relative;
    display: inline-block;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,.12);
    margin-bottom: 14px;
  }
  .result-img-wrap img,
  .result-img-wrap canvas {
    display: block;
    width: 100%;
    max-width: 400px;
    height: auto;
    border-radius: var(--radius);
  }
  .chk-label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    cursor: pointer;
    padding: 2px 0;
  }
  .chk-label input[type=checkbox] {
    width: 15px;
    height: 15px;
    accent-color: var(--hdk);
    cursor: pointer;
    flex-shrink: 0;
  }
  .hex-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .hex-mask {
    width: 200px;
    height: 200px;
    opacity: .15;
  }

  /* 상태 표시 */
  .status-box {
    display: none;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 12px;
    margin-top: 12px;
    line-height: 1.6;
  }
  .status-box.show { display: block; }
  .status-loading { background: #F0F8FF; border: 1px solid #C0D8F0; color: #3A6FA0; }
  .status-error   { background: #FFF0F0; border: 1px solid #F0C0C0; color: #A03030; }
  .status-success { background: #F0FFF4; border: 1px solid #A0E0B0; color: #207040; }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid #C0D8F0;
    border-top-color: #3A6FA0;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .meta-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .meta-badge {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--hlt);
    color: var(--hdk);
    font-weight: 600;
  }
  .hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    line-height: 1.7;
    background: var(--hlt);
    padding: 8px 12px;
    border-radius: 10px;
  }
  .model-tag {
    display: inline-block;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 700;
    margin-left: 6px;
    vertical-align: middle;
  }
  .tag-free { background: #E8FFE8; color: #208040; }
  .tag-paid { background: #FFF0E8; color: #A04020; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>🍯 Gemini 이미지 생성 테스트</h1>
    <p>HiveRoom 연동 전 API 동작 확인용</p>
  </div>


  <!-- 프롬프트 -->
  <div class="card">
    <div class="card-title">✏️ 프롬프트</div>

    <!-- 이미지 규격 — 숨김 -->
    <textarea id="base-prompt" style="display:none;">Cute kawaii isometric view room illustration. Centered image. regular pointy-top hexagon with all six sides equal length. hexagon is taller than wide. No ceiling. No people. Vivid pastel colors, Japanese kawaii cute style, highly detailed clean illustration,</textarea>

    <!-- 빠른 선택 -->
    <label>이미지 설명</label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
      <div>
        <label style="margin-bottom:4px;">🏠 Room</label>
        <select id="sel-room" onchange="buildPrompt()">
          <option value="">선택</option>
          <option value="bedroom">🛏️ Bedroom</option>
          <option value="living room">🛋️ Living room</option>
          <option value="game room">🎮 Game room</option>
          <option value="library room">📚 Library room</option>
          <option value="study room">💻 Study room</option>
          <option value="kitchen">🍳 Kitchen</option>
          <option value="dining room">🍽️ Dining room</option>
          <option value="music room">🎵 Music room</option>
          <option value="art studio">🎨 Art studio</option>
          <option value="kids room">🧸 Kids room</option>
          <option value="walk-in closet">👗 Walk-in closet</option>
        </select>
      </div>
      <div>
        <label style="margin-bottom:4px;">🌈 Mood</label>
        <select id="sel-mood" onchange="buildPrompt()">
          <option value="">선택</option>
          <option value="cozy">🏡 Cozy</option>
          <option value="delighted">😊 Delighted</option>
          <option value="light and airy">☀️ Light &amp; Airy</option>
          <option value="dark and moody">🌑 Dark &amp; Moody</option>
          <option value="colorful and vivid">🌈 Colorful &amp; Vivid</option>
          <option value="clean and minimal">✨ Clean &amp; Minimal</option>
          <option value="romantic">💕 Romantic</option>
          <option value="retro">📺 Retro</option>
          <option value="futuristic">🚀 Futuristic</option>
          <option value="nature-inspired">🌿 Nature-inspired</option>
        </select>
      </div>
    </div>

    <div style="margin-bottom:10px;">
      <label style="margin-bottom:6px;">🖼️ Wall decorated with <small style="color:#999;font-weight:400;">(최대 2개)</small></label>
      <div id="wall-checks" style="display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:4px;">
        <label class="chk-label"><input type="checkbox" name="wall" value="bright lights"   onchange="limitChecks('wall',2);buildPrompt()"> 💡 Bright lights</label>
        <label class="chk-label"><input type="checkbox" name="wall" value="paintings"        onchange="limitChecks('wall',2);buildPrompt()"> 🖼️ Paintings</label>
        <label class="chk-label"><input type="checkbox" name="wall" value="neon signs"       onchange="limitChecks('wall',2);buildPrompt()"> 🪩 Neon signs</label>
        <label class="chk-label"><input type="checkbox" name="wall" value="large windows"    onchange="limitChecks('wall',2);buildPrompt()"> 🪟 Large windows</label>
        <label class="chk-label"><input type="checkbox" name="wall" value="glass panels"     onchange="limitChecks('wall',2);buildPrompt()"> 🔲 Glass panels</label>
        <label class="chk-label"><input type="checkbox" name="wall" value="bookshelves"      onchange="limitChecks('wall',2);buildPrompt()"> 📚 Bookshelves</label>
        <label class="chk-label"><input type="checkbox" name="wall" value="hanging plants"   onchange="limitChecks('wall',2);buildPrompt()"> 🌿 Hanging plants</label>
        <label class="chk-label"><input type="checkbox" name="wall" value="fairy lights"     onchange="limitChecks('wall',2);buildPrompt()"> ✨ Fairy lights</label>
        <label class="chk-label"><input type="checkbox" name="wall" value="photo frames"     onchange="limitChecks('wall',2);buildPrompt()"> 🖼️ Photo frames</label>
        <label class="chk-label"><input type="checkbox" name="wall" value="mirrors"          onchange="limitChecks('wall',2);buildPrompt()"> 🪞 Mirrors</label>
        <label class="chk-label"><input type="checkbox" name="wall" value="tapestry"         onchange="limitChecks('wall',2);buildPrompt()"> 🎨 Tapestry</label>
      </div>
    </div>

    <div style="margin-bottom:10px;">
      <label style="margin-bottom:6px;">🪑 Furnitures <small style="color:#999;font-weight:400;">(최대 5개)</small></label>
      <div id="furniture-checks" style="display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:4px;">
        <label class="chk-label"><input type="checkbox" name="furniture" value="sofa"           onchange="limitChecks('furniture',5);buildPrompt()"> 🛋️ Sofa</label>
        <label class="chk-label"><input type="checkbox" name="furniture" value="coffee table"   onchange="limitChecks('furniture',5);buildPrompt()"> ☕ Coffee table</label>
        <label class="chk-label"><input type="checkbox" name="furniture" value="bed"            onchange="limitChecks('furniture',5);buildPrompt()"> 🛏️ Bed</label>
        <label class="chk-label"><input type="checkbox" name="furniture" value="nightstand"     onchange="limitChecks('furniture',5);buildPrompt()"> 🌙 Nightstand</label>
        <label class="chk-label"><input type="checkbox" name="furniture" value="computer desk"  onchange="limitChecks('furniture',5);buildPrompt()"> 💻 Computer desk</label>
        <label class="chk-label"><input type="checkbox" name="furniture" value="office chair"   onchange="limitChecks('furniture',5);buildPrompt()"> 🪑 Office chair</label>
        <label class="chk-label"><input type="checkbox" name="furniture" value="dining table"   onchange="limitChecks('furniture',5);buildPrompt()"> 🍽️ Dining table</label>
        <label class="chk-label"><input type="checkbox" name="furniture" value="bookshelf"      onchange="limitChecks('furniture',5);buildPrompt()"> 📚 Bookshelf</label>
        <label class="chk-label"><input type="checkbox" name="furniture" value="armchair"       onchange="limitChecks('furniture',5);buildPrompt()"> 💺 Armchair</label>
        <label class="chk-label"><input type="checkbox" name="furniture" value="gaming setup"   onchange="limitChecks('furniture',5);buildPrompt()"> 🎮 Gaming setup</label>
        <label class="chk-label"><input type="checkbox" name="furniture" value="wardrobe"       onchange="limitChecks('furniture',5);buildPrompt()"> 👗 Wardrobe</label>
        <label class="chk-label"><input type="checkbox" name="furniture" value="dresser"        onchange="limitChecks('furniture',5);buildPrompt()"> 🪞 Dresser</label>
        <label class="chk-label"><input type="checkbox" name="furniture" value="study desk"     onchange="limitChecks('furniture',5);buildPrompt()"> 📖 Study desk</label>
        <label class="chk-label"><input type="checkbox" name="furniture" value="floor lamp"     onchange="limitChecks('furniture',5);buildPrompt()"> 💡 Floor lamp</label>
        <label class="chk-label"><input type="checkbox" name="furniture" value="piano"          onchange="limitChecks('furniture',5);buildPrompt()"> 🎹 Piano</label>
        <label class="chk-label"><input type="checkbox" name="furniture" value="music stand"    onchange="limitChecks('furniture',5);buildPrompt()"> 🎵 Music stand</label>
        <label class="chk-label"><input type="checkbox" name="furniture" value="indoor plant"   onchange="limitChecks('furniture',5);buildPrompt()"> 🪴 Indoor plant</label>
        <label class="chk-label"><input type="checkbox" name="furniture" value="kitchen counter" onchange="limitChecks('furniture',5);buildPrompt()"> 🍳 Kitchen counter</label>
      </div>
    </div>
    <textarea id="prompt" placeholder="또는 직접 입력하세요..."></textarea>
  </div>

  <!-- 생성 버튼 -->
  <button class="btn btn-primary" id="gen-btn" onclick="generateImage()">✨ 이미지 생성하기</button>

  <!-- 상태 -->
  <div class="status-box" id="status-box"></div>

  <!-- 결과 -->
  <div class="card result-area" id="result-area" style="margin-top:16px;">
    <div class="card-title">🎨 생성 결과</div>
    <div class="result-img-wrap">
      <canvas id="result-canvas" width="1024" height="1024"></canvas>
    </div>
    <div class="meta-row" id="meta-row"></div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-secondary" style="margin:0;" onclick="downloadImg()">⬇️ 다운로드</button>
      <button class="btn btn-secondary" style="margin:0;" onclick="generateImage()">🔄 다시 생성</button>
    </div>
  </div>

</div>

<script>
const PROXY_URL = 'https://oval-trombone-obedience.ngrok-free.dev';

function limitChecks(name, max) {
  const boxes = document.querySelectorAll(`input[name="${name}"]`);
  const checked = [...boxes].filter(b => b.checked);
  if (checked.length > max) {
    checked[checked.length - 1].checked = false;
  }
}

function buildPrompt() {
  const room = document.getElementById('sel-room').value;
  const mood = document.getElementById('sel-mood').value;
  const walls = [...document.querySelectorAll('input[name="wall"]:checked')].map(b => b.value);
  const furns = [...document.querySelectorAll('input[name="furniture"]:checked')].map(b => b.value);
  if (!room && !mood && !walls.length && !furns.length) return;
  let sentence = (mood ? mood + ' ' : '') + (room || '');
  if (walls.length)  sentence += ' with ' + walls.join(' and ') + ' on wall';
  if (furns.length)  sentence += ', ' + furns.join(', ') + ' placed';
  document.getElementById('prompt').value = sentence.trim();
}

function setPrompt(text){
  document.getElementById('prompt').value = text;
}

function showStatus(type, msg){
  const el = document.getElementById('status-box');
  el.className = `status-box show status-${type}`;
  el.innerHTML = type === 'loading'
    ? `<span class="spinner"></span>${msg}`
    : msg;
}
function hideStatus(){
  document.getElementById('status-box').classList.remove('show');
}

async function generateImage(){
  const basePrompt  = document.getElementById('base-prompt').value.trim();
  const userPrompt  = document.getElementById('prompt').value.trim();
  const prompt      = userPrompt ? basePrompt + ' ' + userPrompt : basePrompt;

  if(!userPrompt){ showStatus('error', '❌ 이미지 설명을 입력해주세요.'); return; }

  const btn = document.getElementById('gen-btn');
  btn.disabled = true;
  document.getElementById('result-area').classList.remove('show');
  showStatus('loading', '이미지 생성 중... (최대 2분 소요)');

  const abort = new AbortController();
  const timer = setTimeout(() => abort.abort(), 120_000);

  try {
    let imageBase64 = null;
    let mimeType = 'image/png';

    showStatus('loading', '🎨 이미지 생성 중...');
    const res = await fetch(`${PROXY_URL}/sdapi/v1/txt2img`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: abort.signal,
      body: JSON.stringify({ prompt, steps: 9, width: 640, height: 640, cfg_scale: 1 })
    });

    if(!res.ok){
      let errMsg = `HTTP ${res.status}`;
      try { const e = await res.json(); errMsg = e?.error || e?.detail || JSON.stringify(e); } catch{}
      throw new Error(`서버 연결 실패 (${errMsg})`);
    }

    const data = await res.json();
    const b64 = data?.images?.[0];
    if(!b64) throw new Error('이미지 데이터 없음');
    imageBase64 = b64;

    if(!imageBase64) throw new Error('이미지 데이터가 없어요.');

    const src = `data:${mimeType};base64,${imageBase64}`;
    window._lastImgSrc = src;
    window._lastMime = mimeType;

    document.getElementById('meta-row').innerHTML = `
      <span class="meta-badge">ERNIE-Image-Turbo</span>
      <span class="meta-badge">형식: ${mimeType}</span>
      <span class="meta-badge">✅ 생성 완료</span>
    `;
    document.getElementById('result-area').classList.add('show');
    showStatus('success', '✅ 이미지 생성 성공! HiveRoom 연동이 가능해요.');

    applyCanvas(src);

  } catch(e){
    clearTimeout(timer);
    const msg = e.name === 'AbortError' ? '⏱️ 요청 시간 초과 (2분). 다시 시도해주세요.' : `❌ 오류: ${e.message || e}`;
    showStatus('error', msg);
  } finally {
    clearTimeout(timer);
    btn.disabled = false;
  }
}

function applyCanvas(src) {
  const img = new Image();
  img.onload = function() {
    const canvas = document.getElementById('result-canvas');
    const ctx = canvas.getContext('2d');
    const size = 640;
    canvas.width = size;
    canvas.height = size;
    ctx.clearRect(0, 0, size, size);

    // Always apply hexagon masking
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, size, size);
    ctx.save();
    ctx.beginPath();
    const cx = 320, cy = 320, r = 300; // 캔버스 정중앙, 정규 육각형
    for (let i = 0; i < 6; i++) {
      const angle = (Math.PI / 3) * i - Math.PI / 2;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(img, 0, 0, size, size);
    ctx.restore();
  };
  img.src = src;
}

function downloadImg(){
  if(!window._lastImgSrc) return;
  const canvas = document.getElementById('result-canvas');
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = `gemini_room_${Date.now()}.png`;
  a.click();
}
</script>
</body>
</html>
